name: update-and-deploy
on:
  schedule:
    - cron: "30 3 * * *"   # 06:30 Israel time
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated chain keys (empty = all in config.json)"
        default: ""
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q il-supermarket-scraper
      # scraper DEBUG logs dump whole HTML pages; keep only our own progress lines
      - run: |
          set -o pipefail
          python scripts/ingest.py "${{ inputs.chains }}" 2>&1 | grep --line-buffered -vE "^Logger|^\s*<|^\s*$|^\s+[a-z{}();]" || true
          test -f docs/data/meta.json
      # data lives on its own branch, replaced every day, so main's history stays small
      - name: publish data branch
        run: |
          cd docs/data
          git init -q -b data
          git config user.name "smart-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "prices $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

  deploy:
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: data
          path: docs/data
      - run: rm -rf docs/data/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
