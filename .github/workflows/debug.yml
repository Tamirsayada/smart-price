name: debug
on:
  workflow_dispatch:
    inputs:
      code:
        default: "print('hi')"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q il-supermarket-scraper && pip show il-supermarket-scraper | head -2
      - run: python scripts/debug.py
