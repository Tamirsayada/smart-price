<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>מחיר חכם</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>מחיר חכם</h1>
  <span id="updated" class="muted"></span>
</header>

<main>
  <section id="scan-card" class="card">
    <div id="cam" class="cam">
      <video id="video" playsinline muted autoplay></video>
      <div id="frame" class="frame">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="laser"></div>
      </div>
      <div id="hint" class="hint">שים את הברקוד בתוך המסגרת, לרוחב</div>
      <div class="cam-tools">
        <button id="torch" class="tool hidden" aria-label="פנס">🔦</button>
        <button id="switch-cam" class="tool hidden" aria-label="החלף מצלמה">🔄</button>
      </div>
      <div id="cam-overlay" class="cam-overlay hidden">
        <button id="cam-action" class="primary">📷 הפעל מצלמה</button>
        <p id="cam-msg"></p>
      </div>
    </div>
    <form id="manual" class="row">
      <input id="barcode-input" inputmode="numeric" pattern="[0-9]*" placeholder="או הקלד ברקוד" autocomplete="off">
      <button type="submit">חפש</button>
    </form>
  </section>

  <section id="result" class="card hidden"></section>

  <details class="card settings">
    <summary>הגדרות תמחור</summary>
    <label>תוספת מקסימלית למוצר "שקוף": <b id="maxup-val"></b>%
      <input id="maxup" type="range" min="0" max="100" step="5">
    </label>
    <label>עיגול מחיר לסיומת
      <select id="ending">
        <option value="0.90">.90</option>
        <option value="0.99">.99</option>
        <option value="0.50">.50 / .90</option>
        <option value="none">בלי עיגול</option>
      </select>
    </label>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.min.js"></script>
<script src="app.js"></script>
</body>
</html>
